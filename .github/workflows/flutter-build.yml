name: Flutter Build

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "ci-logs/**", "releases/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Decode production signing key
        working-directory: ./mobile
        # Reconstructs android/key.properties + the keystore file from
        # repository secrets, entirely inside this ephemeral runner
        # workspace -- neither file is ever written back to the repository.
        # If the secrets are not configured (e.g. a fork, or before the repo
        # owner has added them), this step deliberately no-ops: build.gradle
        # detects the absence of key.properties and falls back to debug
        # signing, so the pipeline still goes green end-to-end either way.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set -- release APK will fall back to debug signing."
            exit 0
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but one or more of ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD is missing. Add all four secrets, or remove all four to intentionally use debug signing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/setumitra-release.p12
          if ! keytool -list -storetype PKCS12 -keystore android/app/setumitra-release.p12 -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded keystore failed to open with the provided ANDROID_KEYSTORE_PASSWORD -- check the secret values."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=setumitra-release.p12
          storeType=PKCS12
          EOF
          echo "Production signing key decoded and verified; release build will be signed with it."

      - name: Analyze
        working-directory: ./mobile
        # --no-fatal-infos: advisory "info" level lints (e.g. an SDK
        # deprecation notice on a newer stable Flutter channel release)
        # must not fail the build on their own -- only real analyzer
        # warnings/errors should. This is what previously made this step
        # fail on 10 purely informational issues with no actual errors.
        run: flutter analyze --no-fatal-infos

      - name: Install native SQLite (for sqflite_common_ffi in tests)
        # The AI AutoFill test suite exercises the real sqflite-backed
        # DatabaseService/AutoFillMappingService (the existing deterministic
        # AutoFill path AiMappingService reuses) via sqflite_common_ffi,
        # which dlopen()s the system libsqlite3 at test time instead of
        # going through the sqflite Android/iOS platform channel (not
        # available under plain `flutter test`). ubuntu-latest GitHub-hosted
        # runners normally already have libsqlite3-0 preinstalled, but this
        # step makes that an explicit, verified precondition rather than an
        # assumption -- apt-get install is a no-op (exits 0 instantly) when
        # the package is already present.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Run tests
        working-directory: ./mobile
        # Per the master spec's explicit Phase-1 exit gate: "Tests pass" and
        # "Flutter test passes" are separate, mandatory conditions -- a
        # green Gradle build alone is not sufficient, and this step must
        # genuinely execute (and this workflow must genuinely fail) rather
        # than being skipped or treated as advisory.
        #
        # --reporter expanded + tee: the plain default reporter truncates
        # passing-test noise but still needs to be captured somewhere this
        # offline-diagnosis environment can actually read -- its only path
        # back here is committing it to the repo (see the next step),
        # exactly like the existing release-build log capture below.
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test-output.log

      - name: Capture test log on failure (for offline diagnosis)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, subprocess

          log_path = "/tmp/test-output.log"
          try:
              with open(log_path, "rb") as f:
                  data = f.read()
          except FileNotFoundError:
              data = b"(no log captured -- test step produced no /tmp/test-output.log)"

          tail = data[-120000:]
          b64 = base64.b64encode(tail).decode()
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          api = f"https://api.github.com/repos/{repo}/contents/ci-logs/last-test-failure.txt"
          headers = ["-H", f"Authorization: Bearer {token}", "-H", "Accept: application/vnd.github+json"]

          get = subprocess.run(["curl", "-s", *headers, api], capture_output=True, text=True)
          sha = None
          try:
              j = json.loads(get.stdout)
              sha = j.get("sha")
          except Exception:
              pass

          payload = {
              "message": f"ci: capture test failure log (run {run_id}) [skip ci]",
              "content": b64,
              "branch": "main",
          }
          if sha:
              payload["sha"] = sha

          put = subprocess.run(
              ["curl", "-s", "-w", "\\nHTTP:%{http_code}\\n", "-X", "PUT", *headers, api, "-d", json.dumps(payload)],
              capture_output=True, text=True,
          )
          print(put.stdout[-1500:])
          print(put.stderr[-1500:])
          PYEOF

      - name: Build release APK
        working-directory: ./mobile
        # explicit pipefail: without it, `tee`'s own exit code (always 0)
        # is what this step reports, silently masking a real failure in
        # `flutter build` -- exactly what happened on the previous run,
        # where this step showed "success" with no APK ever produced.
        #
        # --split-per-abi: a single universal APK bundles arm64-v8a +
        # armeabi-v7a + x86_64 native libraries together (this app's ML Kit
        # on-device OCR pipeline alone contributes ~30MB of native code per
        # ABI), making the combined file ~90MB -- too large for several
        # delivery paths (e.g. chat upload limits) and larger than it needs
        # to be for any single device. Splitting produces one APK per ABI
        # (~25-30MB each); essentially all real Android phones from the last
        # several years are arm64-v8a, so that file alone is normally all
        # that is needed to install on a physical device.
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee /tmp/build-apk.log

      - name: Capture build log on failure (for offline diagnosis)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, subprocess

          log_path = "/tmp/build-apk.log"
          try:
              with open(log_path, "rb") as f:
                  data = f.read()
          except FileNotFoundError:
              data = b"(no log captured -- build step produced no /tmp/build-apk.log)"

          tail = data[-60000:]
          b64 = base64.b64encode(tail).decode()
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          api = f"https://api.github.com/repos/{repo}/contents/ci-logs/last-build-failure.txt"
          headers = ["-H", f"Authorization: Bearer {token}", "-H", "Accept: application/vnd.github+json"]

          get = subprocess.run(["curl", "-s", *headers, api], capture_output=True, text=True)
          sha = None
          try:
              j = json.loads(get.stdout)
              sha = j.get("sha")
          except Exception:
              pass

          payload = {
              "message": f"ci: capture build failure log (run {run_id}) [skip ci]",
              "content": b64,
              "branch": "main",
          }
          if sha:
              payload["sha"] = sha

          put = subprocess.run(
              ["curl", "-s", "-w", "\\nHTTP:%{http_code}\\n", "-X", "PUT", *headers, api, "-d", json.dumps(payload)],
              capture_output=True, text=True,
          )
          print(put.stdout[-1500:])
          print(put.stderr[-1500:])
          PYEOF

      - name: Verify APK was actually produced
        working-directory: ./mobile
        run: |
          OUT_DIR="build/app/outputs/flutter-apk"
          MISSING=0
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK_PATH="$OUT_DIR/app-$ABI-release.apk"
            if [ ! -f "$APK_PATH" ]; then
              echo "::error::Release APK was not produced at $APK_PATH"
              MISSING=1
            else
              echo "Verified: $APK_PATH exists ($(du -h "$APK_PATH" | cut -f1))"
            fi
          done
          if [ "$MISSING" != "0" ]; then
            exit 1
          fi

      - name: Record APK signer info (for offline verification)
        # Runs regardless of pass/fail so far: this is how the signing setup
        # gets verified from an environment that cannot download the binary
        # artifact itself (its download endpoint redirects to blob storage
        # outside this workflow's diagnosing environment's network policy).
        # It writes only a public certificate fingerprint -- never key
        # material -- to the repo, the same way build failures are captured.
        if: always()
        working-directory: ./mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SIGNED_WITH_PRODUCTION_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          OUT="/tmp/signer-info.txt"
          {
            echo "signed_with_production_key_secret_present=$SIGNED_WITH_PRODUCTION_KEY"
            echo "checked_apk=$APK_PATH (arm64-v8a split; other ABI splits are signed identically with the same signingConfig)"
            if [ -f "$APK_PATH" ]; then
              CERT_FILE=$(mktemp)
              if unzip -p "$APK_PATH" 'META-INF/*.RSA' > "$CERT_FILE" 2>/dev/null && [ -s "$CERT_FILE" ]; then
                keytool -printcert -file "$CERT_FILE" 2>&1
              elif unzip -p "$APK_PATH" 'META-INF/*.DSA' > "$CERT_FILE" 2>/dev/null && [ -s "$CERT_FILE" ]; then
                keytool -printcert -file "$CERT_FILE" 2>&1
              else
                echo "No v1 (JAR) signature block found in the APK -- it may be signed with v2/v3 scheme only. Signer block search result:"
                unzip -l "$APK_PATH" | grep -i "META-INF" || echo "(no META-INF entries at all)"
              fi
              rm -f "$CERT_FILE"
            else
              echo "APK not found at $APK_PATH -- build did not produce output."
            fi
          } > "$OUT" 2>&1
          cat "$OUT"
          python3 - <<'PYEOF'
          import base64, json, os, subprocess

          with open("/tmp/signer-info.txt", "rb") as f:
              data = f.read()

          b64 = base64.b64encode(data).decode()
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/contents/ci-logs/last-signer-info.txt"
          headers = ["-H", f"Authorization: Bearer {token}", "-H", "Accept: application/vnd.github+json"]

          get = subprocess.run(["curl", "-s", *headers, api], capture_output=True, text=True)
          sha = None
          try:
              j = json.loads(get.stdout)
              sha = j.get("sha")
          except Exception:
              pass

          payload = {
              "message": "ci: record APK signer info [skip ci]",
              "content": b64,
              "branch": "main",
          }
          if sha:
              payload["sha"] = sha

          put = subprocess.run(
              ["curl", "-s", "-w", "\\nHTTP:%{http_code}\\n", "-X", "PUT", *headers, api, "-d", json.dumps(payload)],
              capture_output=True, text=True,
          )
          print(put.stdout[-1500:])
          print(put.stderr[-1500:])
          PYEOF

      - name: Upload release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SetuMitra-Release-APK
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Commit release APK into repository (direct-fetch fallback)
        # actions/upload-artifact's download endpoint redirects through Azure
        # Blob Storage, which is unreachable from the offline-diagnosis
        # environment used to drive this pipeline (egress policy blocks that
        # host). Committing the APK itself as a normal tracked file lets it
        # be retrieved with a plain `git pull` instead, which already works
        # fine over this repo's normal GitHub remote. paths-ignore on
        # "releases/**" (see the `on.push` trigger above) stops this commit
        # from re-triggering the workflow.
        #
        # Deliberately does NOT touch `origin`'s URL/credentials:
        # actions/checkout@v4 already configures an authenticated
        # `http.https://github.com/.extraheader` for this exact remote from
        # `permissions.contents: write`, and layering a second
        # x-access-token@ URL-embedded credential on top of that conflicts
        # with it (this is what made the first attempt at this step fail).
        # Commits only the arm64-v8a split (what essentially every real
        # Android phone needs) to keep this repository's size bounded on
        # every rebuild. The armeabi-v7a and x86_64 splits remain available
        # via the "Upload release APK artifacts" step above for anyone who
        # specifically needs them (older 32-bit devices / emulators).
        id: commit_apk
        if: success()
        run: |
          set -o pipefail
          {
            mkdir -p releases
            cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk releases/SetuMitra-release-arm64-v8a.apk
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git add releases/SetuMitra-release-arm64-v8a.apk
            if git diff --cached --quiet; then
              echo "APK content unchanged since last commit -- nothing to do."
              exit 0
            fi
            git commit -m "release: update SetuMitra-release-arm64-v8a.apk (run ${{ github.run_id }}) [skip ci]"
            echo "--- working tree state right after commit ---"
            git status --short
            git diff --stat
            success=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Pushed release APK on attempt $attempt."
                success=1
                break
              fi
              echo "--- rebase/push failed on attempt $attempt; working tree state: ---"
              git status --short
              git diff --stat
              echo "Push attempt $attempt failed -- retrying..."
              git rebase --abort 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              sleep 5
            done
            if [ "$success" != "1" ]; then
              echo "::error::Failed to push releases/SetuMitra-release-arm64-v8a.apk after 5 attempts."
              exit 1
            fi
          } 2>&1 | tee /tmp/commit-apk.log

      - name: Capture APK-commit failure log (for offline diagnosis)
        if: failure() && steps.commit_apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, subprocess

          try:
              with open("/tmp/commit-apk.log", "rb") as f:
                  data = f.read()
          except FileNotFoundError:
              data = b"(no log captured -- step produced no /tmp/commit-apk.log)"

          tail = data[-60000:]
          b64 = base64.b64encode(tail).decode()
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          api = f"https://api.github.com/repos/{repo}/contents/ci-logs/last-apk-commit-failure.txt"
          headers = ["-H", f"Authorization: Bearer {token}", "-H", "Accept: application/vnd.github+json"]

          get = subprocess.run(["curl", "-s", *headers, api], capture_output=True, text=True)
          sha = None
          try:
              j = json.loads(get.stdout)
              sha = j.get("sha")
          except Exception:
              pass

          payload = {
              "message": f"ci: capture APK-commit failure log (run {run_id}) [skip ci]",
              "content": b64,
              "branch": "main",
          }
          if sha:
              payload["sha"] = sha

          put = subprocess.run(
              ["curl", "-s", "-w", "\\nHTTP:%{http_code}\\n", "-X", "PUT", *headers, api, "-d", json.dumps(payload)],
              capture_output=True, text=True,
          )
          print(put.stdout[-1500:])
          print(put.stderr[-1500:])
          PYEOF
