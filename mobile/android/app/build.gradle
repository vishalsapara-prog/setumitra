plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

// Production release signing.
//
// `android/key.properties` is NEVER committed to this repository (see
// android/.gitignore) -- it only exists transiently:
//   - on a developer's own machine, hand-created from the keystore they hold, or
//   - on a GitHub Actions runner, generated at build time by the "Decode
//     signing key" workflow step from 4 repository secrets
//     (ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS /
//     ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD).
//
// When key.properties is absent (e.g. a contributor's local debug build with
// no signing secrets available), the release buildType safely falls back to
// the Android SDK's auto-generated debug signing config below, exactly as
// this project already did before production signing was wired in -- so a
// plain `flutter build apk --release` never hard-fails on a machine that
// simply hasn't been given the production key.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigningConfig = keystorePropertiesFile.exists()
if (hasReleaseSigningConfig) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
    def requiredKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missingKeys = requiredKeys.findAll { !keystoreProperties.getProperty(it) }
    if (!missingKeys.isEmpty()) {
        throw new GradleException(
            "android/key.properties is present but missing required key(s): " +
            missingKeys.join(", ") + ". Either supply all of " +
            requiredKeys.join(", ") + ", or delete key.properties entirely " +
            "to fall back to debug signing."
        )
    }
    def resolvedStoreFile = rootProject.file("app/${keystoreProperties['storeFile']}")
    if (!resolvedStoreFile.exists()) {
        throw new GradleException(
            "android/key.properties references storeFile '" +
            keystoreProperties['storeFile'] + "' but no such file exists at " +
            resolvedStoreFile.absolutePath + "."
        )
    }
}

android {
    namespace "com.example.setumitra"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.example.setumitra"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file("${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeType keystoreProperties.getProperty("storeType", "PKCS12")
            }
        }

        // Overrides the Android Gradle Plugin's IMPLICIT default debug
        // signing config (which auto-generates a brand-new, randomly-keyed
        // debug.keystore under $HOME/.android/ the first time it's needed on
        // whatever machine runs the build). On GitHub Actions' ephemeral
        // runners that file never pre-exists, so every CI run with no
        // production key configured used to get a DIFFERENT random debug
        // key -- confirmed by directly comparing two consecutive CI builds'
        // actual v2 signing certificates, which had completely different
        // SHA-256 fingerprints despite both being plain "Android Debug"
        // certs. That made every such APK upgrade-INCOMPATIBLE with the one
        // before it. app/shared-debug.keystore (committed; see android/
        // .gitignore's explicit exception and comment -- it is a non-secret
        // debug-only key, never used for any real release) makes this
        // signing identity stable across every build, local or CI, so
        // consecutive debug-signed APKs install as upgrades of each other.
        debug {
            storeFile file("shared-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}
